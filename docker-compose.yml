services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dotlens
      POSTGRES_PASSWORD: dotlens
      POSTGRES_DB: dotlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dotlens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dotlens-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
