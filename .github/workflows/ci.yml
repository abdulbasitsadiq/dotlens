name: CI

# ROADMAP Phase 3.5, "THE OPERATIONAL FLOOR", item 1. The verification matrix
# below is not a default — it is the matrix that catches the defect classes this
# project actually ships:
#
#   cargo test  --workspace --all-features          the suite
#   cargo check --workspace --no-default-features   THE ONE THAT MATTERS MOST
#
# The second half is the one that earns its minutes. Build-matrix breaks that
# `--all-features` cannot see shipped in slices 8, 9 and 13 and were found only
# at verification; four of slice 16's five review blockers were mechanical and
# would have been caught here. "The failure this guards against is not
# ignorance; it is being tired."

# Every branch push. There is deliberately NO `pull_request` trigger: a PR from
# a branch in THIS repo would run the same commit a second time, and this is a
# private repo on a minutes budget (see the cost note at the bottom of the file).
# Add `pull_request` only when a PR can come from a fork, which for a solo
# project it cannot.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes. For a solo
# operator pushing fixups this is the single largest minutes saving available.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused across runs and would only inflate
  # the cache we pay to restore.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: test --workspace --all-features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # 16-ALPINE, not 16, and the difference is not cosmetic: docker-compose
        # runs alpine, and musl vs glibc is a COLLATION difference. Text
        # ordering must not differ between the machine that develops and the
        # machine that gates, or `ORDER BY` in a reader is tested against one
        # collation and shipped against another.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dotlens
          POSTGRES_PASSWORD: dotlens
          POSTGRES_DB: dotlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dotlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # pg_integration.rs creates and DROPS a throwaway database per test, so
      # this is an admin URL. POSTGRES_USER is the image's bootstrap superuser,
      # which is what makes `create database` work without extra grants.
      DATABASE_URL: postgres://dotlens:dotlens@localhost:5432/dotlens
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the channel and already lists rustfmt+clippy,
      # so rustup installs the right thing without a third-party action.
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo --version && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          # Feature branches RESTORE the cache but never write one. Without
          # this, every branch writes ~1-2 GB and they evict each other (and
          # main) out of the 10 GB per-repo cache budget.
          #
          # MEASURED, so a later session does not assume this works: until
          # `main` had run once NO CACHE EXISTED, and every branch run was
          # structurally cold. That is no longer true — main run 32742967387
          # saved 369 MB (test) + 162 MB (check), and dispatch run 32743494710
          # restored it "full match: true", cutting test 4.2min -> 1.9min and
          # check 1.2min -> 0.3min. Both real numbers are at the foot of this
          # file. Note 531 MB total, not the 1-2 GB per job guessed above:
          # `save-if` is buying headroom, not rescuing a budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: no test may reach the network
        run: bash .github/scripts/no-network-in-tests.sh

      # `--nocapture` is REQUIRED, not decoration: the test harness captures
      # stdout/stderr for passing tests, and the pg tests' "SKIP:" line is
      # printed by a test that then passes. Without it the skip is invisible and
      # the guard below has nothing to read.
      - name: cargo test --workspace --all-features
        run: |
          set -o pipefail
          cargo test --workspace --all-features -- --nocapture 2>&1 | tee /tmp/test.log

      # THE POSTGRES TESTS MUST HAVE RUN, NOT SKIPPED.
      # pg_integration.rs skips loudly without DATABASE_URL and every skipped
      # test still PASSES, so a broken service container would leave the run
      # green over a quarter of the suite. A green tick that means "we did not
      # look" is the exact failure this project refuses everywhere else.
      - name: the postgres tests must have run
        run: |
          set -uo pipefail
          if ! grep -q 'pg_integration' /tmp/test.log; then
            echo "::error::the pg_integration test binary did not run at all"
            exit 1
          fi
          n=$(grep -c 'SKIP: DATABASE_URL not set' /tmp/test.log || true)
          if [ "${n:-0}" -ne 0 ]; then
            echo "::error::$n postgres integration tests SKIPPED — this run would have been green over a quarter of the suite"
            exit 1
          fi
          echo "postgres integration tests ran. Per-binary results:"
          grep -E 'Running |test result:' /tmp/test.log || true

  # ---------------------------------------------------------------------------
  # THE GATE THAT MATTERS MOST. It has no Postgres service and needs none:
  # pg_integration.rs is `#![cfg(feature = "pg")]`, so under
  # --no-default-features the file compiles to nothing.
  check-no-default-features:
    name: check the build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --no-default-features

      # THE MIDDLE OF THE MATRIX, which the two ends cannot see.
      # `--all-features` and `--no-default-features` exercise both-on and
      # both-off. `dotlens-node` has TWO features and `main.rs` carries
      # `#[cfg(all(feature = "pg", feature = "live"))]` items — so a one-feature
      # build is a real shape, and it is precisely where an item gated on the
      # conjunction goes missing while both ends still compile.
      #
      # Steps rather than a third job on purpose: this rides the cache the step
      # above just warmed and adds seconds, where a job would add a whole
      # billable minute of rounding. Named steps keep the failure attributable.
      - name: check dotlens-node with pg but not live
        run: cargo check -p dotlens-node --no-default-features --features pg
      - name: check dotlens-node with live but not pg
        run: cargo check -p dotlens-node --no-default-features --features live

  # ---------------------------------------------------------------------------
  # THIS JOB WAS AUTHORED, DELETED, AND IS BACK IN THE COMMIT THAT MADE IT PASS.
  #
  # It was deleted before CI's first push because both halves were red on
  # arrival on this tree (measured 2026-08-24, rust 1.97.1): 992 fmt hunks
  # across 58 files, and 39 clippy warnings across 5 targets. A gate that is red
  # on arrival teaches you to ignore red, which costs more than the gate is
  # worth — so the rule was "add it back in the SAME commit that lands the
  # cleanup, never before", and this is that commit. Both commands are observed
  # passing locally on the tree this job ships with.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # Separate steps on purpose: a formatting diff and a lint failure are
      # different problems and should not be reported as one red job.
      #
      # AND THEY ARE NOT INDEPENDENT, which the cleanup slice found the hard
      # way: rustfmt collapsing a block-bodied closure to an expression closure
      # CREATED a clippy warning that had not existed before the sweep. Running
      # fmt first is what surfaced it while the tree was still being swept. If
      # this job ever goes red on clippy right after a formatting change, that
      # is the mechanism, not a flake.
      - run: cargo clippy --workspace --all-features -- -D warnings

# COST, and whether it is sustainable.
#
# Private repos on GitHub Free include 2,000 Linux minutes/month (Pro and Team:
# 3,000); Linux is the 1x multiplier and service containers add nothing. Billing
# rounds each JOB up to the whole minute, so three jobs cost three roundings.
#
# MEASURED 2026-08-24 over all five verification runs, and the estimates this
# comment used to carry were WRONG BY 5x IN THE EXPENSIVE DIRECTION (~30
# min/push cold guessed; ~6 measured). Run 1 (32741280632) is the cold
# reference:
#
#   test --workspace --all-features          3m 54s   -> 4 billable
#   check --workspace --no-default-features  1m 20s   -> 2 billable
#   run time 5m 14s                                   => 6 min/push
#
# The first four runs were all COLD, because `save-if` restricts saving to
# `main` and main had not run yet. They agree within seconds — test 3.3-4.2min,
# check 1.1-1.4min — so 6-7 min/push is the COLD figure.
#
# WARM IS NOW MEASURED TOO, and is no longer an inference. Dispatch run
# 32743494710 restored a full cache hit:
#
#                     test        check       billable/push
#   cold (no cache)   3.3-4.2min  1.1-1.4min  6-7 min
#   warm (full hit)   1.9 min     0.3 min     3 min
#
# The floor is 3 minutes whatever happens: three jobs, each rounded up.
#
# `lint` IS UNMEASURED AS THIS LANDS. It is a check-shaped job with no Postgres
# and no test binaries, so it should sit near `check`'s 0.3 warm / 1.2 cold
# minutes — but that is an inference and the numbers above are not. Replace this
# paragraph with the real figure after the first push, the way every other
# number in this file was.
#
# ~3 min/push warm against 2,000/month is ~660 pushes; even all-cold is ~330.
# The whole of this pipeline's verification — five runs, four cold, including
# both deliberate break tests — cost 28 billable minutes. The budget is not a
# constraint on this project at this size, and the levers below are recorded
# for when that stops being true rather than because it is close.
#
# The levers, in the order to reach for them if that stops being true:
#   1. `paths-ignore` above (already on) — README-only pushes cost nothing.
#   2. `concurrency` above (already on)  — superseded pushes are cancelled.
#   3. Drop `test` to a main-only or scheduled job, leaving the cheap
#      `check` gate on every branch push.
#   4. Merge the two jobs into one so the toolchain+checkout setup is paid
#      once — costs parallel feedback and makes "which gate failed" harder to
#      read, which is why it is last.
