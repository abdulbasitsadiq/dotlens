# Polkadot Asset Hub — "Polkadot Hub"; centre of activity since 2025-11-04
id: polkadot-asset-hub
name: Polkadot Asset Hub
family: substrate
relay: polkadot
para_id: 1000
network: polkadot
ss58_prefix: 0

# Short names the search grammar's `on <chain>` suffix accepts. DATA, so a
# chain added later brings its own and api::search needs no edit.
aliases:
  - ah
  - assethub
  - hub
  - pah
lifecycle:
  - status: live
    from: "2021-06-01T00:00:00Z"   # Statemint-era launch, approximate — verify exact genesis date (ecosystem-verifier) before Phase 1
endpoints:
  rpc:
    - wss://polkadot-asset-hub-rpc.polkadot.io
    - wss://asset-hub-polkadot-rpc.n.dwellir.com
    - wss://statemint.api.onfinality.io/public-ws
capabilities:
  blocks: true
  extrinsics: true
  events: true
  runtime_metadata: true
  assets:
    instances: [trust_backed, foreign, pool]
  governance: true
  staking: true
  treasury: true
  contracts_revive:
    from_spec: 2000005      # ref 1828 era, runtime 2.0.5 — verify exact spec_version on-chain
  evm_rpc_view: true
  xcm:
    min_version: 2
# Non-derivable well-known accounts (ECOSYSTEM.md §6). Derivable modl/para/sibl
# accounts are GENERATED by the labeling engine — never listed here.
accounts:
  - address: 16VcQSRcMFy6ZHVjBvosKmo7FKqTb8ZATChDYo8ibutzLnos
    label: Fellowship expenditure (location-derived)
    kind: treasury
    note: >-
      NOT the py/feltr pallet account — a separate location-derived account
      (~2M DOT). ECOSYSTEM.md §6 says label both.
  - address: 14xmwinmCEz6oRrFdczHKqHgWNMiCysE2KrA4jXXAAM1Eogk
    label: Legacy relay-treasury (location-derived, pre-migration)
    kind: treasury
    note: residual funds UNVERIFIED — verify-labels records on-chain existence
modules:
  - blocks
  - extrinsics
  - events
  - accounts
  - balances
  - assets
  - governance
  - treasury
  - xcm
