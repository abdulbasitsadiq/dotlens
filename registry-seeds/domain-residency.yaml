# Which chain hosts which functional domain, over time. THE anti-migration table.
# Facts verified Aug 2026 — see ../../ECOSYSTEM.md §1. Times are UTC.
# Kusama entries will be added when Kusama chains are registered.

# Where each referenda INSTANCE lives, as data. The class names are adapter
# vocabulary (adapter_substrate::gov maps pallet → class); this table says which
# residency domain carries each one, so the gov API can stitch a class across
# chains without knowing any chain id. Unlisted classes fall back to
# 'governance' — the public OpenGov default.
# `pallet` is the decoder-lowercased instance pallet name, and it is load-
# bearing: Collectives runs THREE referenda instances, and their track ids
# COLLIDE (id 1 is "members" for the Fellowship and "ambassador" for the
# Ambassador programme). Without filtering tracks by pallet, one chain's track
# list is ambiguous. Verified 2026-08-16: /v1/gov/polkadot/tracks?class=
# fellowship_referenda returned 27 rows across two instances.
referenda_classes:
  - class: referenda
    domain: governance
    pallet: referenda
  - class: fellowship_referenda
    domain: fellowship
    pallet: fellowshipreferenda

# Where each treasury pallet INSTANCE lives, same doctrine as the referenda
# classes above. Instance names are adapter vocabulary (mapped from the pallet
# name); this table says which residency domain carries each, so the treasury
# API stitches the main treasury across the Nov-2025 migration while the
# Collectives sub-treasuries resolve to their own chain. Unlisted instances
# fall back to the 'treasury' domain.
treasury_instances:
  - instance: treasury
    domain: treasury
  - instance: fellowship_treasury
    domain: fellowship_treasury
  - instance: ambassador_treasury
    domain: ambassador_treasury

residency:
  - domain: governance
    network: polkadot
    chain: polkadot
    from: "2020-05-26T00:00:00Z"
    to: "2025-11-04T00:00:00Z"
  - domain: governance
    network: polkadot
    chain: polkadot-asset-hub
    from: "2025-11-04T00:00:00Z"
    to: null

  - domain: staking
    network: polkadot
    chain: polkadot
    from: "2020-05-26T00:00:00Z"
    to: "2025-11-04T00:00:00Z"
  - domain: staking
    network: polkadot
    chain: polkadot-asset-hub
    from: "2025-11-04T00:00:00Z"
    to: null

  # named to match the module ("balances") — the history API resolves this
  - domain: balances
    network: polkadot
    chain: polkadot
    from: "2020-05-26T00:00:00Z"
    to: "2025-11-04T00:00:00Z"
  - domain: balances
    network: polkadot
    chain: polkadot-asset-hub
    from: "2025-11-04T00:00:00Z"
    to: null

  - domain: treasury
    network: polkadot
    chain: polkadot
    from: "2020-05-26T00:00:00Z"
    to: "2025-11-04T00:00:00Z"
  - domain: treasury
    network: polkadot
    chain: polkadot-asset-hub
    from: "2025-11-04T00:00:00Z"
    to: null

  # consensus never moved — and won't until JAM
  - domain: consensus
    network: polkadot
    chain: polkadot
    from: "2020-05-26T00:00:00Z"
    to: null

  # The Fellowship did NOT move to Asset Hub in Nov 2025 — its referenda and
  # its rank-weighted votes stay on Collectives (verified: the AH runtime at
  # spec 2003002 carries no ranked-collective pallet).
  - domain: fellowship
    network: polkadot
    chain: polkadot-collectives
    from: "2022-11-21T11:36:30Z"   # VERIFIED 2026-08-16 = the chain's own
                                   # block #1 timestamp. Unlike identity below,
                                   # this domain has no separate arrival date:
                                   # the Fellowship pallets shipped in the
                                   # genesis runtime of a chain built for them,
                                   # so residency starts with the chain.
    to: null

  # The Collectives sub-treasuries. Both are pallet instances on the same
  # chain as the Fellowship, and both are separate money from the main
  # treasury — verified 2026-08-16: the AH runtime carries no FellowshipTreasury
  # or AmbassadorTreasury pallet. Windows open at the chain's genesis (block #1
  # timestamp); the Ambassador programme itself started later, which matters
  # only if you query its residency before it existed.
  - domain: fellowship_treasury
    network: polkadot
    chain: polkadot-collectives
    from: "2022-11-21T11:36:30Z"
    to: null
  - domain: ambassador_treasury
    network: polkadot
    chain: polkadot-collectives
    from: "2022-11-21T11:36:30Z"
    to: null

  # The OTHER migration: pallet-identity LEFT the relay for the People chain —
  # the first time functionality left rather than joined it. Boundary = ref 983
  # ("People Chain Migration and Release") Executed at relay block 21800000,
  # 2024-07-25T12:04:30Z. The real handover was a WINDOW, not an instant: that
  # enactment enabled `reap_identity` on the relay, and the People chain
  # unblocked public calls 43,200 blocks (~3 days) later. We model the
  # enactment instant and say so.
  - domain: identity
    network: polkadot
    chain: polkadot
    from: "2020-05-26T00:00:00Z"
    to: "2024-07-25T12:04:30Z"
  - domain: identity
    network: polkadot
    chain: polkadot-people
    from: "2024-07-25T12:04:30Z"
    to: null
