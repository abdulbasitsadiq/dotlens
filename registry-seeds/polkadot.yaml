# Polkadot relay chain — the "minimal relay" post Asset Hub migration (RFC-0032)
id: polkadot
name: Polkadot
family: substrate
relay: null            # it IS a relay
para_id: null
network: polkadot
# WHOSE TOKEN this chain's pallet_balances holds (Phase 3 slice 6). `own` = this
# chain ISSUES its native currency, so the token's absolute XCM name is the
# chain's own path. Not derivable from `para_id`: Hydration and Asset Hub are
# both parachains and their native currencies are different assets.
native_token: own

ss58_prefix: 0

# Short names the search grammar's `on <chain>` suffix accepts. DATA, so a
# chain added later brings its own and api::search needs no edit.
aliases:
  - relay
  - rc
  - dot
  - polkadot-relay
lifecycle:
  - status: live
    from: "2020-05-26T00:00:00Z"
endpoints:
  rpc:
    - wss://rpc.polkadot.io
    - wss://polkadot-rpc.dwellir.com
capabilities:
  blocks: true
  extrinsics: true
  events: true
  runtime_metadata: true
  consensus: true          # relay-only: parachain validation, session keys
  hrmp_admin: true
  on_demand_coretime: true
modules:
  - blocks
  - extrinsics
  - events
  - accounts
  - balances               # historical only — balances domain resided here pre-2025-11-04
  - treasury               # historical only — the treasury resided here
                           # pre-2025-11-04; the post-migration relay runtime
                           # has no treasury pallet, so live mapping is a no-op
  - governance             # historical only — governance resided here pre-2025-11-04;
                           # the post-migration relay runtime has no referenda pallet,
                           # so live mapping is a no-op and tracks sync yields zero rows
  - xcm                    # the relay is half the transport story: it RECEIVES every
                           # UMP message (messageQueue, origin Ump(Para(id))) and SENDS
                           # every DMP one. Without this the xcm follower never starts
                           # here and half of every journey is invisible.
  - hrmp                   # the CHANNEL GRAPH, and it is relay-only by construction:
                           # a parachain sees an `AbridgedHrmpChannel` view of its
                           # OWN channels through the relay state proof and cannot
                           # see channels it is not an endpoint of, so the complete
                           # graph exists on exactly one chain per network. A
                           # separate module from `xcm` above because that one gates
                           # a MESSAGE follower that runs on many chains, while this
                           # gates a state reader that must resolve to exactly one —
                           # `chains_with_module` returns a set precisely so the
                           # caller can refuse on zero or two rather than pick.
                           # (Note the `hrmp_admin` capability above is a different
                           # mechanism and is still read by nothing.)
  - coretime               # OCCUPANCY only, and it lives HERE rather than on the
                           # Coretime chain: `paraInclusion` names both the para id
                           # and the core index, so which core actually produced a
                           # block is a RELAY fact. The Coretime chain (1005) owns
                           # the ENTITLEMENT half — regions, renewals, sales — and is
                           # not registered yet; the product is the delta between
                           # them, and this is the term nobody else has.
