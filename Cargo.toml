[workspace]
resolver = "2"
members = [
    "crates/registry",
    "crates/canonical",
    "crates/raw-store",
    "crates/ingest",
    "crates/adapter-substrate",
    "crates/sim",
    "crates/api",
    "crates/dotlens-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# keep this list minimal and boring — every dep must earn its place
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
hex = "0.4"
blake2 = "0.10"
# the raw-store format slice: solid-bucket compression. Measured -3 as the knee
# (AH 101.2x bucketed vs 111x at -19 for 4.6x the time; relay flat at 2.4x).
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "process", "io-util"] }
subxt = "0.50"
# pure decode stack (no network): versions may need bumping at first compile
frame-metadata = { version = "23", features = ["current", "decode"] }
frame-decode = "0.18"
scale-value = { version = "0.18", features = ["serde"] }
scale-info = "2"
parity-scale-codec = "3"
bs58 = "0.5"
dotenvy = "0.15"
axum = "0.8"
# HTML templating for the web surface (Phase 3.5). Compile-time checked and
# escaping by default, which is the property that matters: a page that
# interpolates chain data into markup must not be able to inject it. 0.27 is
# the first release built on `axum-core 0.5`, which is what axum 0.8 uses — a
# two-version graph here would be a trait-impl failure, not a warning.
maud = { version = "0.27", features = ["axum"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "json",
] }

# internal crates
registry = { path = "crates/registry" }
canonical = { path = "crates/canonical" }
raw-store = { path = "crates/raw-store" }
ingest = { path = "crates/ingest" }
adapter-substrate = { path = "crates/adapter-substrate" }
sim = { path = "crates/sim" }
api = { path = "crates/api" }

[profile.dev]
# faster iterative builds; opt where it matters later
debug = 1
